<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -14 240 262" width="960" height="1048" font-family="Helvetica, Arial, sans-serif">
  <!-- 1 unit = 1 m. North is up. Validated plan for S-006 (07/11/2026). -->
  <rect x="-10" y="-14" width="240" height="262" fill="#1b1d22"/>
  <rect x="0" y="0" width="220" height="220" fill="#2b2e35" stroke="#8a8f99" stroke-width="0.8"/>
  <!-- grid every 20 m -->
  <g stroke="#363a42" stroke-width="0.3">
    <path d="M20 0V220M40 0V220M60 0V220M80 0V220M100 0V220M120 0V220M140 0V220M160 0V220M180 0V220M200 0V220"/>
    <path d="M0 20H220M0 40H220M0 60H220M0 80H220M0 100H220M0 120H220M0 140H220M0 160H220M0 180H220M0 200H220"/>
  </g>
  <!-- borders -->
  <rect x="0" y="0" width="220" height="10" fill="#4a3f35"/>
  <text x="110" y="6.5" font-size="4" fill="#d8cfc4" text-anchor="middle">Voie ferrée sur remblai</text>
  <rect x="210" y="10" width="10" height="210" fill="#3f4048"/>
  <text x="215" y="115" font-size="4" fill="#cfd2d8" text-anchor="middle" transform="rotate(90 215 115)">Autoroute, mur antibruit</text>
  <rect x="0" y="212" width="210" height="8" fill="#3f4048"/>
  <text x="105" y="217.5" font-size="4" fill="#cfd2d8" text-anchor="middle">Boulevard barré (grillages de chantier)</text>
  <rect x="0" y="10" width="6" height="202" fill="#34402f"/>
  <text x="3" y="115" font-size="3.6" fill="#c9d4c2" text-anchor="middle" transform="rotate(-90 3 115)">Friche et grillage</text>
  <!-- paths -->
  <g stroke="#454a54" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M155 12 V50 H105 V185 H40"/>
    <path d="M105 120 H200 V200"/>
    <path d="M40 50 H105"/>
    <path d="M40 50 V185"/>
  </g>
  <!-- facades (non visitables) -->
  <g fill="#5d626d" stroke="#8a8f99" stroke-width="0.4">
    <rect x="15" y="22" width="70" height="12"/>
    <rect x="125" y="22" width="70" height="12"/>
    <rect x="15" y="60" width="12" height="70"/>
    <rect x="185" y="55" width="12" height="55"/>
    <rect x="45" y="192" width="55" height="12"/>
    <rect x="125" y="160" width="12" height="40"/>
    <rect x="150" y="145" width="45" height="10"/>
  </g>
  <g font-size="3.4" fill="#e3e5ea" text-anchor="middle">
    <text x="50" y="29">Barre A (R+4)</text>
    <text x="160" y="29">Barre B (R+4)</text>
    <text x="21" y="96" transform="rotate(-90 21 96)">Barre C (R+4)</text>
    <text x="191" y="83" transform="rotate(90 191 83)">Barre D (R+4)</text>
    <text x="72" y="199">Barre E (R+4)</text>
    <text x="131" y="180" transform="rotate(90 131 180)">Barre F</text>
    <text x="172" y="151">Barre G</text>
  </g>
  <!-- visitable buildings -->
  <g fill="#7a5a2a" stroke="#f0c070" stroke-width="0.9">
    <rect x="92" y="88" width="24" height="24"/>
    <rect x="140" y="60" width="38" height="24"/>
    <rect x="45" y="135" width="42" height="14"/>
    <rect x="140" y="95" width="40" height="22" fill="#5a4626" stroke-dasharray="2 1.2"/>
  </g>
  <g font-size="3.6" fill="#ffe6b0" text-anchor="middle" font-weight="bold">
    <text x="104" y="99" font-size="3.1">1 · Tour des</text><text x="104" y="104" font-size="3.1">Tilleuls (R+12)</text>
    <text x="159" y="71">2 · Centre social</text><text x="159" y="76">Jean-Moulin</text>
    <text x="66" y="143.5">3 · Galerie commerciale</text>
    <text x="160" y="105">4 · Parking souterrain</text><text x="160" y="110">(sous la dalle)</text>
  </g>
  <!-- points of interest -->
  <g font-size="3.2" fill="#c8ccd4">
    <rect x="50" y="70" width="22" height="22" fill="none" stroke="#9aa0aa" stroke-width="0.5" stroke-dasharray="1.5 1"/>
    <text x="61" y="80" text-anchor="middle">Aire de jeux</text><text x="61" y="84" text-anchor="middle">(balançoire)</text>
    <rect x="148" y="180" width="30" height="20" fill="none" stroke="#9aa0aa" stroke-width="0.5"/>
    <text x="163" y="191" text-anchor="middle">City stade</text>
    <g fill="#4c505a" stroke="#9aa0aa" stroke-width="0.3">
      <rect x="9" y="150" width="8" height="5"/><rect x="9" y="156" width="8" height="5"/><rect x="9" y="162" width="8" height="5"/><rect x="9" y="168" width="8" height="5"/><rect x="9" y="174" width="8" height="5"/><rect x="9" y="180" width="8" height="5"/>
    </g>
    <text x="20" y="168">Boxes de garages</text><text x="20" y="172">(leurres, alarmes)</text>
    <rect x="96" y="150" width="9" height="7" fill="#2f6b4a" stroke="#7fd6a5" stroke-width="0.6"/>
    <text x="108" y="155">Transformateur</text>
  </g>
  <!-- exit -->
  <rect x="150" y="0" width="10" height="12" fill="#1b1d22" stroke="#7fd6a5" stroke-width="0.8"/>
  <text x="163" y="16" font-size="3.4" fill="#7fd6a5">Sortie : tunnel sous la voie</text>
  <!-- car alarms -->
  <g fill="#e08a2e">
    <circle cx="38" cy="45" r="1.6"/><circle cx="120" cy="45" r="1.6"/><circle cx="200" cy="140" r="1.6"/><circle cx="85" cy="170" r="1.6"/><circle cx="35" cy="120" r="1.6"/><circle cx="195" cy="205" r="1.6"/>
  </g>
  <!-- monster spawn -->
  <circle cx="190" cy="190" r="4" fill="none" stroke="#c94040" stroke-width="0.8"/>
  <text x="190" y="191.3" font-size="3.4" fill="#ff8080" text-anchor="middle">M</text>
  <!-- legend -->
  <g font-size="3.6" fill="#d6d9de">
    <text x="0" y="-6" font-size="5" font-weight="bold" fill="#ffffff">S-006 · Cité des Tilleuls · 220 × 220 m</text>
    <rect x="0" y="226" width="5" height="4" fill="#7a5a2a" stroke="#f0c070" stroke-width="0.5"/><text x="7" y="229.5">Bâtiment visitable (fusible possible)</text>
    <rect x="80" y="226" width="5" height="4" fill="#5d626d"/><text x="87" y="229.5">Façade non visitable</text>
    <circle cx="140" cy="228" r="1.6" fill="#e08a2e"/><text x="144" y="229.5">Voiture à alarme</text>
    <circle cx="2.5" cy="236" r="2.2" fill="none" stroke="#c94040" stroke-width="0.6"/><text x="7" y="237.5">Apparition du monstre</text>
    <text x="80" y="237.5">Grille : 20 m</text>
    <text x="140" y="237.5">Brouillard : on voit à ~25 m</text>
  </g>
</svg>
