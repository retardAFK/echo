name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GUT_VERSION: "9.7.1"
  GDTOOLKIT_VERSION: "4.5.0"
  # Constitution 2.2 and D-007: uncompressed web build budget
  WEB_BUDGET_MB: "60"

jobs:
  lint:
    name: GDScript lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"

      - name: gdformat
        run: gdformat --check game tests

      - name: gdlint
        run: gdlint game tests

  godot:
    name: Import, tests and web export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Godot and web templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-web-linux-arm64-${{ runner.os }}

      - name: Download Godot, web and Linux export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # Only the web templates and the Linux ones (dedicated server, S-010:
          # x86_64 for the CI, arm64 for the Oracle Ampere server, T-108) are kept
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz 'templates/web_*' 'templates/linux_release.x86_64' 'templates/linux_release.arm64' 'templates/version.txt' -d "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz
          ls -la "$dest"

      - name: Add Godot to PATH
        run: |
          chmod +x ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"
          ~/godot/godot --headless --version

      - name: Install GUT
        run: |
          git clone --depth 1 --branch "v${GUT_VERSION}" https://github.com/bitwes/Gut.git /tmp/gut
          mkdir -p addons
          cp -r /tmp/gut/addons/gut addons/gut

      - name: Import project
        run: godot --headless --import

      - name: Run GUT tests
        run: |
          mkdir -p build/test-results
          godot --headless -s addons/gut/gut_cmdln.gd

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: warn

      - name: Stamp the game version
        # Shown in the end-of-game summary (S-009, T-081): the commit it was built from.
        run: |
          sed -i '/^\[application\]/a config/version="'"${GITHUB_SHA::7}"'"' project.godot
          grep -n "config/version" project.godot

      # T-108: the web build plays online on the server named by the variable
      # ECHO_HOST (its domain). The settings go back as they were right after,
      # for the network checks below, which run on this machine.
      - name: Export web build
        env:
          ECHO_HOST: ${{ vars.ECHO_HOST }}
        run: |
          mkdir -p build/web
          if [ -n "$ECHO_HOST" ]; then
            sed -i '/^script = /a server_address = "wss://'"$ECHO_HOST"'"' game/data/net_settings.tres
            grep -n server_address game/data/net_settings.tres
          fi
          godot --headless --export-release "Web" build/web/index.html
          git checkout -- game/data/net_settings.tres
          test -f build/web/index.html
          test -f build/web/index.pck
          test -f build/web/index.wasm

      - name: Check web download budget
        run: |
          size=$(du -sb build/web | cut -f1)
          limit=$((WEB_BUDGET_MB * 1024 * 1024))
          echo "Web build: $((size / 1024 / 1024)) MB / ${WEB_BUDGET_MB} MB"
          gz=$(tar -C build/web -cf - . | gzip -9 | wc -c)
          echo "Web build size: $((size / 1024 / 1024)) MB / ${WEB_BUDGET_MB} MB (gzip: $((gz / 1024 / 1024)) MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Web build exceeds the ${WEB_BUDGET_MB} MB budget (constitution 2.2)"
            exit 1
          fi

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web/
          retention-days: 14

      # S-010, T-094: the dedicated server is the same project exported for
      # Linux without visuals. It is started as the lobby, and 4 players
      # connect to a room it starts (tools/godot/net_smoke.tscn).
      - name: Export dedicated server
        run: |
          mkdir -p build/server
          godot --headless --export-release "Server" build/server/echo_server.x86_64
          test -x build/server/echo_server.x86_64
          echo "Server build: $(( $(stat -c %s build/server/echo_server.x86_64) / 1024 / 1024 )) MB" >> "$GITHUB_STEP_SUMMARY"
          # T-108: the same for the ARM processor of the Oracle Ampere server.
          godot --headless --export-release "Server ARM" build/server/echo_server.arm64
          file build/server/echo_server.arm64 | grep -q "ARM aarch64"

      - name: Connect 4 players to the server and play online
        run: |
          build/server/echo_server.x86_64 --headless -- --lobby > build/server/lobby.log 2>&1 &
          sleep 2
          set +e
          timeout 60 godot --headless res://tools/godot/net_smoke.tscn 2>&1 | tee build/server/smoke.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            # T-097: one player walks in a launched game with 150 ms of ping.
            timeout 90 godot --headless res://tools/godot/net_walk.tscn 2>&1 | tee -a build/server/smoke.log
            code=${PIPESTATUS[0]}
          fi
          if [ "$code" -eq 0 ]; then
            # T-102: the player cuts its connection and gets its place back.
            timeout 90 godot --headless res://tools/godot/net_rejoin.tscn 2>&1 | tee -a build/server/smoke.log
            code=${PIPESTATUS[0]}
          fi
          if [ "$code" -eq 0 ]; then
            # T-103: a whole game by 4 scripted players (1 monster, 3
            # hunted: a capture, a rescue, the fuses, the exit).
            mkdir -p build/server/match
            for index in 0 1 2 3; do
              timeout 440 godot --headless res://tools/godot/net_match.tscn -- --index $index \
                --dir build/server/match > build/server/match/client$index.log 2>&1 &
              pids[$index]=$!
            done
            for index in 0 1 2 3; do
              wait ${pids[$index]} || code=1
              grep ECHO_NET_MATCH build/server/match/client$index.log | tee -a build/server/smoke.log
            done
            if [ "$code" -ne 0 ]; then
              tail -n 20 build/server/match/client*.log
            fi
          fi
          pkill -f echo_server.x86_64
          echo "--- lobby and rooms ---"
          cat build/server/lobby.log
          grep -E "ECHO_NET_(SMOKE|WALK|REJOIN|MATCH)" build/server/smoke.log >> "$GITHUB_STEP_SUMMARY"
          grep "load" build/server/lobby.log | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload server build
        uses: actions/upload-artifact@v7
        with:
          name: server-build
          path: |
            build/server/echo_server.x86_64
            build/server/echo_server.arm64
          retention-days: 14

      # T-108: every merge to main goes to the online server (tools/server),
      # with the same version as the itch.io build. Needs the variable
      # ECHO_HOST (the server's domain) and the secret ECHO_DEPLOY_KEY (the
      # private key of the "echo" user); skipped without them.
      - name: Deploy the server
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ECHO_HOST: ${{ vars.ECHO_HOST }}
          ECHO_DEPLOY_KEY: ${{ secrets.ECHO_DEPLOY_KEY }}
          ECHO_SERVER_ARCH: ${{ vars.ECHO_SERVER_ARCH || 'arm64' }}
        run: |
          if [ -z "$ECHO_HOST" ] || [ -z "$ECHO_DEPLOY_KEY" ]; then
            echo "::notice::server not set up (ECHO_HOST, ECHO_DEPLOY_KEY): not deployed"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ECHO_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$ECHO_HOST" >> ~/.ssh/known_hosts
          bash tools/server/deploy.sh "build/server/echo_server.${ECHO_SERVER_ARCH}"
          rm ~/.ssh/id_ed25519
          echo "Server ${GITHUB_SHA::7} deployed to wss://${ECHO_HOST}/lobby" >> "$GITHUB_STEP_SUMMARY"

      # S-009, T-076 (Q1): every merge to main goes to the restricted itch.io
      # page of the test build (a manual run on main republishes it). Needs the secret BUTLER_API_KEY and the
      # variable ITCH_TARGET ("user/game"); skipped without them.
      - name: Publish test build to itch.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "::notice::itch.io not set up (BUTLER_API_KEY, ITCH_TARGET): test build not published"
            exit 0
          fi
          curl -fsSL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d ~/butler
          chmod +x ~/butler/butler
          ~/butler/butler -V
          ~/butler/butler push build/web "${ITCH_TARGET}:html5" --userversion "${GITHUB_SHA::7}"
          echo "Test build ${GITHUB_SHA::7} published to https://${ITCH_TARGET%%/*}.itch.io/${ITCH_TARGET#*/}" >> "$GITHUB_STEP_SUMMARY"
